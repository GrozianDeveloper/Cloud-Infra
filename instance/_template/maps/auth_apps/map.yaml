  - name: Netbird
    slug: netbird
    description: NetBird dashboard OIDC (keep embedded Dex)
    name_in_app: Authentik
    type: oauth2
    launch: "https://{NETBIRD_DOMAIN}"
    bind_groups:
      - netbird
    provider:
      name: netbird
      client_type: public
      consent: implicit
      grant_types: authorization_code, refresh_token, client_credentials, password, urn:ietf:params:oauth:grant-type:device_code
      scopes: email, openid, profile, offline_access, goauthentik.io/api
      signing_key: authentik Self-signed Certificate
      sub_mode: hashed_user_id
      redirects:
        - matching: strict
          kind: authorization
          url: "https://{NETBIRD_DOMAIN}/nb-auth"
        - matching: strict
          kind: authorization
          url: "https://{NETBIRD_DOMAIN}/nb-silent-auth"
        - matching: strict
          kind: authorization
          url: "https://{NETBIRD_DOMAIN}/peers"
        - matching: strict
          kind: authorization
          url: "https://{NETBIRD_DOMAIN}/auth"
        - matching: strict
          kind: authorization
          url: "https://{NETBIRD_DOMAIN}/silent-auth"
        - matching: strict
          kind: authorization
          url: http://localhost:53100
        - matching: strict
          kind: authorization
          url: http://localhost:53000
    secrets:
      file: instance/netbird-server/.env.oidc
      client_id: NETBIRD_AUTH_CLIENT_ID

