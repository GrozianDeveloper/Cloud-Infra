apps:
  - name: Nextcloud
    slug: nextcloud
    description: Nextcloud AIO (user_oidc)
    name_in_app: authentik
    type: oauth2
    launch: "https://{NEXTCLOUD_DOMAIN}"
    bind_groups:
      - cloud
    provider:
      name: nextcloud
      client_type: confidential
      consent: explicit
      grant_types: authorization_code, refresh_token
      scopes: openid, profile, email, entitlements, nextcloud, offline_access, groups
      signing_key: authentik Self-signed Certificate
      access_token_validity: minutes=15
      refresh_token_validity: days=35
      refresh_token_threshold: days=17
      access_code_validity: minutes=1;seconds=30
      logout_method: backchannel
      logout_uri: "https://{NEXTCLOUD_DOMAIN}/apps/user_oidc/backchannel-logout/1"
      redirects:
        - matching: strict
          kind: authorization
          url: "https://{NEXTCLOUD_DOMAIN}/apps/user_oidc/code"
        - matching: strict
          kind: authorization
          url: "https://{NEXTCLOUD_DOMAIN}/index.php/apps/user_oidc/code"
        - matching: strict
          kind: logout
          url: "https://{AUTH_DOMAIN}/if/user/"
    secrets:
      file: instance/master-nextcloud-aio/.env.oidc
      client_id: NC_OIDC_CLIENT_ID
      client_secret: NC_OIDC_CLIENT_SECRET
      discovery: NC_OIDC_DISCOVERY
      endsession: NC_OIDC_ENDSESSION
      post_logout: NC_OIDC_POST_LOGOUT

  - name: Home
    slug: home
    description: Church Home Assistant stub (not wired)
    name_in_app: home
    type: oauth2
    launch: ""
    bind_groups:
      - home
    provider:
      name: home
      client_type: confidential
      consent: implicit
      grant_types: authorization_code, refresh_token
      scopes: openid, email, profile, groups, offline_access
      signing_key: authentik Self-signed Certificate
      redirects:
        - matching: strict
          kind: authorization
          url: https://localhost/auth/oidc/callback
    secrets:
      file: instance/home/.env.oidc
      client_id: HOME_OIDC_CLIENT_ID
      client_secret: HOME_OIDC_CLIENT_SECRET
      discovery: HOME_OIDC_DISCOVERY

